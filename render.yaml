# Deploiement Render (Blueprint) : un seul service web gratuit qui sert l'API et le site.
# La base PostgreSQL est externe (Neon, offre gratuite) : renseigner DATABASE_URL dans Render.
services:
  - type: web
    name: tressia
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: cd apps/api && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # chaine de connexion Neon, avec ?sslmode=require
      - key: WEB_ORIGIN
        sync: false # URL publique du service, ex. https://tressia.onrender.com
      - key: ADMIN_PASSWORD
        sync: false # mot de passe du compte admin@tressia.test en ligne (10 caracteres min.)
