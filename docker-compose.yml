services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tressia
      POSTGRES_PASSWORD: tressia
      POSTGRES_DB: tressia
    ports:
      - "54329:5432"
    volumes:
      - tressia_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  tressia_pg:
